name: Bootstrap Strata pre-DeepSeek-removal baseline

on:
  push:
    paths:
      - ".github/workflows/bootstrap-baseline.yml"

permissions:
  contents: write

jobs:
  import-baseline:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout continuity-lab repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone exact Strata pre-removal baseline
        run: |
          git clone https://github.com/Niko1221/Strata.git /tmp/strata-baseline
          cd /tmp/strata-baseline
          git checkout e4309aaf325176f90a844ad7833b58552b6ef5e1

      - name: Import baseline working tree
        run: |
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/strata-baseline/ ./

          mkdir -p lab/upstream-workflows-snapshot
          if [ -d /tmp/strata-baseline/.github/workflows ]; then
            cp -a /tmp/strata-baseline/.github/workflows/. lab/upstream-workflows-snapshot/
          fi

          cat > UPSTREAM-BASELINE.md <<'EOF'
          # Upstream baseline

          This repository is an independent compatibility/evolution experiment derived
          from the public Strata repository.

          - Upstream: https://github.com/Niko1221/Strata
          - Exact baseline: `e4309aaf325176f90a844ad7833b58552b6ef5e1`
          - Selection rule: exact working-tree state immediately before the
            `DeepSeek out` removal series
          - Import model: working-tree snapshot, not rewritten upstream Git history
          - Purpose: retain the historical DeepSeek implementation while replaying later
            non-removal upstream changes and measuring compatibility/maintenance cost

          Upstream workflow YAML files are preserved as inert reference material under
          `lab/upstream-workflows-snapshot/` rather than `.github/workflows/`, because
          GitHub does not allow this Actions token to introduce upstream workflow history.

          The upstream MIT license and copyright notice are preserved.
          EOF

      - name: Commit imported baseline snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Baseline already imported; nothing to commit."
            exit 0
          fi
          git commit -m "baseline: import Strata e4309aa pre-removal snapshot [bootstrap-complete]"
          git push origin HEAD:main