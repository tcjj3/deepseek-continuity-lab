name: Continuity Scan After Event 0015

on:
  push:
    paths:
      - ".github/workflows/continuity-after-0015.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout verified continuity branch
        uses: actions/checkout@v4
        with:
          ref: continuity
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "continuity-scan"
          git config user.email "continuity-scan@invalid.local"

      - name: Confirm event 0015 checkpoint
        run: |
          git log -160 --format=%B | grep -F "Upstream-Commit: 0112473047401ede9642a43bc60a458e2266912c"
          bash lab/tools/probe.sh

      - name: Replay until next failure
        id: replay
        shell: bash
        run: |
          before=$(git rev-parse HEAD)
          echo "before=$before" >> "$GITHUB_OUTPUT"
          set +e
          python3 lab/tools/replay_upstream.py 2>&1 | tee /tmp/scan-after-0015.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "after=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture next failure
        if: steps.replay.outputs.rc != '0'
        run: |
          echo "---- rc ----"
          echo "${{ steps.replay.outputs.rc }}"
          echo "---- last clean HEAD ----"
          git log -1 --format=fuller
          echo "---- status ----"
          git status --short
          echo "---- unmerged ----"
          git diff --name-only --diff-filter=U
          echo "---- index stages ----"
          git ls-files -u
          for f in $(git diff --name-only --diff-filter=U); do
            echo "===== COMBINED DIFF: $f ====="
            git diff --cc -- "$f" || true
            echo "===== CONFLICT CONTEXT: $f ====="
            grep -n -B70 -A220 "<<<<<<<" "$f" || true
          done
          echo "---- last 900 replay lines ----"
          tail -n 900 /tmp/scan-after-0015.log || true

      - name: Persist last clean checkpoint
        if: steps.replay.outputs.rc == '10'
        run: |
          git reset --hard HEAD
          git clean -fd
          bash lab/tools/probe.sh
          git push --force origin HEAD:continuity
          echo "checkpoint=$(git rev-parse HEAD)"

      - name: Persist fully replayed line
        if: steps.replay.outputs.rc == '0'
        run: |
          bash lab/tools/probe.sh
          git push --force origin HEAD:continuity

      - name: Mark discovered failure
        if: steps.replay.outputs.rc != '0'
        run: exit 1
