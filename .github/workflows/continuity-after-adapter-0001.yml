name: Continuity Trial After Adapter 0001

on:
  push:
    paths:
      - ".github/workflows/continuity-after-adapter-0001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure disposable branch
        run: |
          git config user.name "continuity-trial"
          git config user.email "continuity-trial@invalid.local"
          git switch -c after-adapter-0001-local

      - name: Replay through event 0001 predecessor
        run: python3 lab/tools/replay_upstream.py --max 27

      - name: Reproduce and resolve event 0001 upstream-first
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py --max 1
          rc=$?
          set -e
          test "$rc" -eq 10
          python3 - <<'PY'
          from pathlib import Path
          p = Path("serve/server.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          a = next((i for i, x in enumerate(lines) if x.startswith("<<<<<<< HEAD")), None)
          if a is None:
              raise SystemExit("event 0001: no conflict marker")
          b = next((i for i in range(a + 1, len(lines)) if lines[i].startswith("=======")), None)
          z = next((i for i in range((b or a) + 1, len(lines)) if lines[i].startswith(">>>>>>>")), None)
          if b is None or z is None:
              raise SystemExit("event 0001: incomplete conflict markers")
          ours = "".join(lines[a + 1:b])
          theirs = "".join(lines[b + 1:z])
          if "self.multi = next(" not in ours:
              raise SystemExit("event 0001: ours side is not the retained DeepSeek multi parser")
          if 'self.can_hold_batch = "holdb" in f[2:]' not in theirs:
              raise SystemExit("event 0001: theirs side is not the new holdb parser")
          lines[a:z + 1] = lines[b + 1:z]
          p.write_text("".join(lines), encoding="utf-8")
          PY
          git add -A
          git commit -m "Merge f-agent-turn b92075d92 into f-p4-int" \
            -m "Upstream-Commit: 291b91025e896f5b579a6c1df9de88df8595c0a8" \
            -m "Continuity-Lab: deepseek-retained" \
            -m "Continuity-Conflict-Resolution: upstream-first"

      - name: Apply continuity adapter 0001
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("serve/server.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          target = 'self.can_hold_batch = "holdb" in f[2:]'
          hits = [i for i, line in enumerate(lines) if line.strip() == target]
          if len(hits) != 1:
              raise SystemExit(f"expected one READY holdb parser, got {len(hits)}")
          if any(line.strip().startswith("self.multi = next(") for line in lines):
              raise SystemExit("multi parser unexpectedly already present")
          i = hits[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          add = indent + 'self.multi = next((int(x[6:]) for x in f[2:] if x.startswith("multi=") and x[6:].isdigit()), 0)\\n'
          lines.insert(i + 1, add)
          p.write_text("".join(lines), encoding="utf-8")
          PY
          git add serve/server.py
          git commit -m "continuity-adapter: preserve DeepSeek multi= READY capability beside holdb" \
            -m "Adapter-For-Upstream: 291b91025e896f5b579a6c1df9de88df8595c0a8" \
            -m "Continuity-Classification: R1-mechanical-replay" \
            -m "Continuity-Adapter-LOC: 1"
          bash lab/tools/probe.sh

      - name: Reproduce and resolve event 0002 upstream-first
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py --max 1
          rc=$?
          set -e
          test "$rc" -eq 10
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/split/test_split_gen_keys.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          a = next((i for i, x in enumerate(lines) if x.startswith("<<<<<<< HEAD")), None)
          if a is None:
              raise SystemExit("event 0002: no conflict marker")
          b = next((i for i in range(a + 1, len(lines)) if lines[i].startswith("=======")), None)
          z = next((i for i in range((b or a) + 1, len(lines)) if lines[i].startswith(">>>>>>>")), None)
          if b is None or z is None:
              raise SystemExit("event 0002: incomplete conflict markers")
          ours = "".join(lines[a + 1:b])
          theirs = "".join(lines[b + 1:z])
          if '"marks", "tail", "shared", "prefill", "rid"' not in ours:
              raise SystemExit("event 0002: ours side no longer matches retained DS keys")
          if 'OTHER_ENGINES = {"prefill", "hold"}' not in theirs:
              raise SystemExit("event 0002: theirs side no longer matches upstream hold classification")
          lines[a:z + 1] = lines[b + 1:z]
          p.write_text("".join(lines), encoding="utf-8")
          PY
          git add -A
          git commit -m "Merge f-agent-turn 018f0d659 into f-p4-int" \
            -m "Upstream-Commit: 4cf79d5dc7ef422206e5366773dd0e62dbc55c10" \
            -m "Continuity-Lab: deepseek-retained" \
            -m "Continuity-Conflict-Resolution: upstream-first"

      - name: Apply continuity adapter 0002
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/split/test_split_gen_keys.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          target = 'OTHER_ENGINES = {"prefill", "hold"}'
          hits = [i for i, line in enumerate(lines) if line.strip() == target]
          if len(hits) != 1:
              raise SystemExit(f"event 0002: expected one upstream OTHER_ENGINES set, got {len(hits)}")
          i = hits[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i] = indent + 'OTHER_ENGINES = {"marks", "tail", "shared", "prefill", "rid", "hold"}\n'
          # Make the nearby comment truthful without changing test behavior.
          j = i - 1
          while j >= 0 and (lines[j].lstrip().startswith("#") or not lines[j].strip()):
              j -= 1
          comment_start = j + 1
          replacement = [
              indent + '# keys only other engines are sent: retained DeepSeek restore-point / multi keys,\n',
              indent + '# the prefill-only split request, and hold for engines whose READY advertises hold/holdb.\n',
          ]
          lines[comment_start:i] = replacement
          p.write_text("".join(lines), encoding="utf-8")
          PY
          git add tests/split/test_split_gen_keys.py
          git commit -m "continuity-adapter: retain DeepSeek-only GEN key classifications beside hold" \
            -m "Adapter-For-Upstream: 4cf79d5dc7ef422206e5366773dd0e62dbc55c10" \
            -m "Continuity-Classification: R1-mechanical-replay" \
            -m "Continuity-Runtime-LOC: 0" \
            -m "Continuity-Test-Logical-Updates: 1"
          bash lab/tools/probe.sh

      - name: Replay through event 0003 predecessor
        run: python3 lab/tools/replay_upstream.py --max 28

      - name: Reproduce and resolve event 0003 upstream-first
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py --max 1
          rc=$?
          set -e
          test "$rc" -eq 10
          test "$(git diff --name-only --diff-filter=U)" = "docs/SETTINGS.md"
          git checkout --theirs -- docs/SETTINGS.md
          git add -A
          git commit -m "docs: settings page regenerated from the register" \
            -m "Upstream-Commit: 5d54982709879000c2e2b783c729850ce1949824" \
            -m "Continuity-Lab: deepseek-retained" \
            -m "Continuity-Conflict-Resolution: upstream-generated-first"

      - name: Apply continuity adapter 0003
        run: |
          python3 tools/settings_register.py --docs
          git add docs/SETTINGS.md
          if git diff --cached --quiet; then
            echo "expected continuity regeneration to differ from post-removal upstream"
            exit 1
          fi
          git commit -m "continuity-adapter: regenerate settings docs with retained DeepSeek register entries" \
            -m "Adapter-For-Upstream: 5d54982709879000c2e2b783c729850ce1949824" \
            -m "Continuity-Classification: R1-generated-artifact-drift" \
            -m "Continuity-Manual-LOC: 0" \
            -m "Continuity-Generated-Files: docs/SETTINGS.md"
          bash lab/tools/probe.sh

      - name: Continue until next failure
        id: continue_replay
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py 2>&1 | tee /tmp/continuity-after-0001.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnose next failure
        if: always()
        run: |
          echo "---- replay rc ----"
          echo "${{ steps.continue_replay.outputs.rc }}"
          echo "---- HEAD ----"
          git log -1 --format=fuller || true
          echo "---- status ----"
          git status --short || true
          echo "---- unmerged ----"
          git diff --name-only --diff-filter=U || true
          echo "---- index stages ----"
          git ls-files -u || true
          for f in $(git diff --name-only --diff-filter=U); do
            echo "===== COMBINED DIFF: $f ====="
            git diff --cc -- "$f" || true
            echo "===== MARKERS: $f ====="
            grep -n -B30 -A60 "<<<<<<<" "$f" || true
          done
          echo "---- last 300 lines ----"
          tail -n 300 /tmp/continuity-after-0001.log || true

      - name: Mark next failure
        if: steps.continue_replay.outputs.rc != '0'
        run: exit 1