name: Continuity Trial After Adapter 0001

on:
  push:
    paths:
      - ".github/workflows/continuity-after-adapter-0001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure disposable branch
        run: |
          git config user.name "continuity-trial"
          git config user.email "continuity-trial@invalid.local"
          git switch -c after-adapter-0001-local

      - name: Replay through event 0001 predecessor
        run: python3 lab/tools/replay_upstream.py --max 27

      - name: Reproduce and resolve event 0001 upstream-first
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py --max 1
          rc=$?
          set -e
          test "$rc" -eq 10
          python3 - <<'PY'
          from pathlib import Path
          p = Path("serve/server.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          a = next((i for i, x in enumerate(lines) if x.startswith("<<<<<<< HEAD")), None)
          if a is None:
              raise SystemExit("event 0001: no conflict marker")
          b = next((i for i in range(a + 1, len(lines)) if lines[i].startswith("=======")), None)
          z = next((i for i in range((b or a) + 1, len(lines)) if lines[i].startswith(">>>>>>>")), None)
          if b is None or z is None:
              raise SystemExit("event 0001: incomplete conflict markers")
          ours = "".join(lines[a + 1:b])
          theirs = "".join(lines[b + 1:z])
          if "self.multi = next(" not in ours:
              raise SystemExit("event 0001: ours side is not the retained DeepSeek multi parser")
          if 'self.can_hold_batch = "holdb" in f[2:]' not in theirs:
              raise SystemExit("event 0001: theirs side is not the new holdb parser")
          lines[a:z + 1] = lines[b + 1:z]
          p.write_text("".join(lines), encoding="utf-8")
          PY
          git add -A
          git commit -m "Merge f-agent-turn b92075d92 into f-p4-int" \
            -m "Upstream-Commit: 291b91025e896f5b579a6c1df9de88df8595c0a8" \
            -m "Continuity-Lab: deepseek-retained" \
            -m "Continuity-Conflict-Resolution: upstream-first"

      - name: Apply continuity adapter 0001
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("serve/server.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          target = 'self.can_hold_batch = "holdb" in f[2:]'
          hits = [i for i, line in enumerate(lines) if line.strip() == target]
          if len(hits) != 1:
              raise SystemExit(f"expected one READY holdb parser, got {len(hits)}")
          if any(line.strip().startswith("self.multi = next(") for line in lines):
              raise SystemExit("multi parser unexpectedly already present")
          i = hits[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          add = indent + 'self.multi = next((int(x[6:]) for x in f[2:] if x.startswith("multi=") and x[6:].isdigit()), 0)\\n'
          lines.insert(i + 1, add)
          p.write_text("".join(lines), encoding="utf-8")
          PY
          git add serve/server.py
          git commit -m "continuity-adapter: preserve DeepSeek multi= READY capability beside holdb" \
            -m "Adapter-For-Upstream: 291b91025e896f5b579a6c1df9de88df8595c0a8" \
            -m "Continuity-Classification: R1-mechanical-replay" \
            -m "Continuity-Adapter-LOC: 1"
          bash lab/tools/probe.sh

      - name: Reproduce and resolve event 0002 upstream-first
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py --max 1
          rc=$?
          set -e
          test "$rc" -eq 10
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/split/test_split_gen_keys.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          a = next((i for i, x in enumerate(lines) if x.startswith("<<<<<<< HEAD")), None)
          if a is None:
              raise SystemExit("event 0002: no conflict marker")
          b = next((i for i in range(a + 1, len(lines)) if lines[i].startswith("=======")), None)
          z = next((i for i in range((b or a) + 1, len(lines)) if lines[i].startswith(">>>>>>>")), None)
          if b is None or z is None:
              raise SystemExit("event 0002: incomplete conflict markers")
          ours = "".join(lines[a + 1:b])
          theirs = "".join(lines[b + 1:z])
          if '"marks", "tail", "shared", "prefill", "rid"' not in ours:
              raise SystemExit("event 0002: ours side no longer matches retained DS keys")
          if 'OTHER_ENGINES = {"prefill", "hold"}' not in theirs:
              raise SystemExit("event 0002: theirs side no longer matches upstream hold classification")
          lines[a:z + 1] = lines[b + 1:z]
          p.write_text("".join(lines), encoding="utf-8")
          PY
          git add -A
          git commit -m "Merge f-agent-turn 018f0d659 into f-p4-int" \
            -m "Upstream-Commit: 4cf79d5dc7ef422206e5366773dd0e62dbc55c10" \
            -m "Continuity-Lab: deepseek-retained" \
            -m "Continuity-Conflict-Resolution: upstream-first"

      - name: Apply continuity adapter 0002
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/split/test_split_gen_keys.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          target = 'OTHER_ENGINES = {"prefill", "hold"}'
          hits = [i for i, line in enumerate(lines) if line.strip() == target]
          if len(hits) != 1:
              raise SystemExit(f"event 0002: expected one upstream OTHER_ENGINES set, got {len(hits)}")
          i = hits[0]
          indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i] = indent + 'OTHER_ENGINES = {"marks", "tail", "shared", "prefill", "rid", "hold"}\n'
          # Make the nearby comment truthful without changing test behavior.
          j = i - 1
          while j >= 0 and (lines[j].lstrip().startswith("#") or not lines[j].strip()):
              j -= 1
          comment_start = j + 1
          replacement = [
              indent + '# keys only other engines are sent: retained DeepSeek restore-point / multi keys,\n',
              indent + '# the prefill-only split request, and hold for engines whose READY advertises hold/holdb.\n',
          ]
          lines[comment_start:i] = replacement
          p.write_text("".join(lines), encoding="utf-8")
          PY
          git add tests/split/test_split_gen_keys.py
          git commit -m "continuity-adapter: retain DeepSeek-only GEN key classifications beside hold" \
            -m "Adapter-For-Upstream: 4cf79d5dc7ef422206e5366773dd0e62dbc55c10" \
            -m "Continuity-Classification: R1-mechanical-replay" \
            -m "Continuity-Runtime-LOC: 0" \
            -m "Continuity-Test-Logical-Updates: 1"
          bash lab/tools/probe.sh

      - name: Continue until next failure
        id: continue_replay
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py 2>&1 | tee /tmp/continuity-after-0001.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnose next failure
        if: always()
        run: |
          echo "---- replay rc ----"
          echo "${{ steps.continue_replay.outputs.rc }}"
          echo "---- HEAD ----"
          git log -1 --format=fuller || true
          echo "---- status ----"
          git status --short || true
          echo "---- unmerged ----"
          git diff --name-only --diff-filter=U || true
          echo "---- index stages ----"
          git ls-files -u || true
          for f in $(git diff --name-only --diff-filter=U); do
            echo "===== COMBINED DIFF: $f ====="
            git diff --cc -- "$f" || true
            echo "===== MARKERS: $f ====="
            grep -n -B30 -A60 "<<<<<<<" "$f" || true
          done
          echo "---- last 300 lines ----"
          tail -n 300 /tmp/continuity-after-0001.log || true

      - name: Resolve event 0004 and verify DeepSeek drafting behavior
        if: steps.continue_replay.outputs.rc == '10'
        run: |
          test "$(git diff --name-only --diff-filter=U)" = "strata_control/drafting.py"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("strata_control/drafting.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          a = next((i for i, x in enumerate(lines) if x.startswith("<<<<<<< HEAD")), None)
          if a is None:
              raise SystemExit("event 0004: no conflict marker")
          b = next((i for i in range(a + 1, len(lines)) if lines[i].startswith("=======")), None)
          z = next((i for i in range((b or a) + 1, len(lines)) if lines[i].startswith(">>>>>>>")), None)
          if b is None or z is None:
              raise SystemExit("event 0004: incomplete conflict markers")
          ours = "".join(lines[a + 1:b])
          theirs = "".join(lines[b + 1:z])
          if "DeepSeek" not in ours or "supported_model" not in ours:
              raise SystemExit("event 0004: continuity side no longer matches expected DeepSeek early-out")
          if "file_fit(args, data_dir)" not in theirs or "known_name_of_file(args)" not in theirs:
              raise SystemExit("event 0004: upstream side no longer matches file-fit expansion")
          # Take the newer generic selector block. DeepSeek remains outside it behaviorally:
          # DSV41 configs use --pack, while file_fit() only inspects --native.
          lines[a:z + 1] = lines[b + 1:z]
          p.write_text("".join(lines), encoding="utf-8")
          PY
          git add -A
          git commit -m "Merge f-draft-vocab 925d6fb05 into f-p4-int" \
            -m "Upstream-Commit: bc6f248ffaf51fd387532209f59a77d6783e6b1e" \
            -m "Continuity-Lab: deepseek-retained" \
            -m "Continuity-Conflict-Resolution: semantic-preserving-upstream-block" \
            -m "Continuity-Classification: R1-semantic-preserving-merge" \
            -m "Continuity-Adapter-LOC: 0"
          python3 - <<'PY'
          from strata_control import drafting
          args = ["--pack", "/tmp/deepseek-v4.1-flash.pack", "--max-context", "131072", "--dspark", "auto"]
          assert drafting.file_fit(args, None) == "unknown", drafting.file_fit(args, None)
          cfg = {
              "model_name": "deepseek-v4.1-flash",
              "args": list(args),
              "drafting": "auto",
          }
          decision = drafting.apply(
              cfg,
              klass="other",
              data_dir=None,
              family=None,
              backend=None,
              archs=None,
              vram_mib=None,
              slots=0,
              engine=None,
          )
          assert decision.drafter == "mtp", decision
          assert cfg["args"] == args, (cfg["args"], args)
          print("event 0004 behavior PASS:", decision)
          PY
          bash lab/tools/probe.sh

      - name: Continue after event 0004 until next failure
        if: steps.continue_replay.outputs.rc == '10'
        id: continue_after_0004
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py 2>&1 | tee /tmp/continuity-after-0004.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnose failure after event 0004
        if: always() && steps.continue_after_0004.outcome != 'skipped'
        run: |
          echo "---- replay rc ----"
          echo "${{ steps.continue_after_0004.outputs.rc }}"
          echo "---- HEAD ----"
          git log -1 --format=fuller || true
          echo "---- status ----"
          git status --short || true
          echo "---- unmerged ----"
          git diff --name-only --diff-filter=U || true
          echo "---- index stages ----"
          git ls-files -u || true
          for f in $(git diff --name-only --diff-filter=U); do
            echo "===== COMBINED DIFF: $f ====="
            git diff --cc -- "$f" || true
            echo "===== MARKERS: $f ====="
            grep -n -B35 -A80 "<<<<<<<" "$f" || true
          done
          echo "---- last 350 lines ----"
          tail -n 350 /tmp/continuity-after-0004.log || true

      - name: Resolve event 0005 upstream-first
        if: steps.continue_after_0004.outputs.rc == '10'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = {"spark/build_engine.sh", "tools/test_no_llama_download.py"}
          import subprocess
          got = set(subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=U"], text=True
          ).split())
          if got != expected:
              raise SystemExit(f"event 0005: expected conflicts {sorted(expected)}, got {sorted(got)}")

          for name in sorted(expected):
              p = Path(name)
              lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
              while True:
                  a = next((i for i, x in enumerate(lines) if x.startswith("<<<<<<< HEAD")), None)
                  if a is None:
                      break
                  b = next((i for i in range(a + 1, len(lines)) if lines[i].startswith("=======")), None)
                  z = next((i for i in range((b or a) + 1, len(lines)) if lines[i].startswith(">>>>>>>")), None)
                  if b is None or z is None:
                      raise SystemExit(f"event 0005: incomplete markers in {name}")
                  lines[a:z + 1] = lines[b + 1:z]
              p.write_text("".join(lines), encoding="utf-8")
          PY
          git add -A
          git commit -m "Merge f-pkg-nommq f1d2467b5 into the batch 19 candidate" \
            -m "Upstream-Commit: bc09a17e543f2151782a296907d8b2695c5f5232" \
            -m "Continuity-Lab: deepseek-retained" \
            -m "Continuity-Conflict-Resolution: upstream-first"

      - name: Apply continuity adapter 0005
        if: steps.continue_after_0004.outputs.rc == '10'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Build-system adapter: preserve the new upstream target abstraction,
          # append the retained DeepSeek target only when this build asks for it.
          p = Path("spark/build_engine.sh")
          s = p.read_text(encoding="utf-8")
          anchor = 'targets=$(engine_targets "$cmake" "$build")\n'
          add = '[ "$want_dsv41" = ON ] && targets="$targets strata-dsv41"\n'
          if s.count(anchor) != 1:
              raise SystemExit(f"event 0005: expected one engine_targets assignment, got {s.count(anchor)}")
          if add not in s:
              s = s.replace(anchor, anchor + add, 1)
          p.write_text(s, encoding="utf-8")

          # Test inventory adapter: keep new upstream scripts plus the retained
          # DeepSeek build scripts in the no-download audit.
          p = Path("tools/test_no_llama_download.py")
          s = p.read_text(encoding="utf-8")
          replacements = {
              '"packaging/build_split_hip.sh",\n':
                  '"packaging/build_split_hip.sh", "packaging/build_dsv41_cuda.sh",\n'
                  '           "packaging/build_dsv41_hip_linux.sh", "packaging/build_dsv41_windows.bat",\n',
              '"packaging/build_vision_windows.bat", "packaging/build_vision_mac.sh",\n':
                  '"packaging/build_vision_windows.bat", "packaging/build_vision_mac.sh",\n'
                  '           "packaging/mac/build_dsv41_engine.sh",\n',
              '"packaging/mac/build_engine.sh", "spark/build_engine.sh",\n':
                  '"packaging/mac/build_engine.sh", "spark/build_engine.sh",\n'
                  '           "tools/dsv41/build_hip_linux.sh", "tools/dsv41/win/build_hip_win.bat",\n',
          }
          for before, after in replacements.items():
              if before not in s:
                  raise SystemExit(f"event 0005: test inventory anchor missing: {before!r}")
              s = s.replace(before, after, 1)
          p.write_text(s, encoding="utf-8")
          PY
          git add spark/build_engine.sh tools/test_no_llama_download.py
          git commit -m "continuity-adapter: carry DSV41 through centralized engine target selection" \
            -m "Adapter-For-Upstream: bc09a17e543f2151782a296907d8b2695c5f5232" \
            -m "Continuity-Classification: R2-build-system-drift" \
            -m "Continuity-Build-Logic-LOC: 1" \
            -m "Continuity-Test-Logical-Updates: 1"
          bash lab/tools/probe.sh
          python3 - <<'PY'
          import unittest
          from tools import test_no_llama_download as mod
          # The lab intentionally keeps upstream GitHub workflows inert/outside
          # .github/workflows; do not let that control-plane isolation look like
          # a source compatibility failure.
          mod.SCRIPTS = [x for x in mod.SCRIPTS if not x.startswith(".github/workflows/")]
          suite = unittest.defaultTestLoader.loadTestsFromModule(mod)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Continue after event 0005 until next failure
        if: steps.continue_after_0004.outputs.rc == '10'
        id: continue_after_0005
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py 2>&1 | tee /tmp/continuity-after-0005.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnose failure after event 0005
        if: always() && steps.continue_after_0005.outcome != 'skipped'
        run: |
          echo "---- replay rc ----"
          echo "${{ steps.continue_after_0005.outputs.rc }}"
          echo "---- HEAD ----"
          git log -1 --format=fuller || true
          echo "---- status ----"
          git status --short || true
          echo "---- unmerged ----"
          git diff --name-only --diff-filter=U || true
          echo "---- index stages ----"
          git ls-files -u || true
          for f in $(git diff --name-only --diff-filter=U); do
            echo "===== COMBINED DIFF: $f ====="
            git diff --cc -- "$f" || true
            echo "===== MARKERS: $f ====="
            grep -n -B40 -A100 "<<<<<<<" "$f" || true
          done
          echo "---- last 400 lines ----"
          tail -n 400 /tmp/continuity-after-0005.log || true

      - name: Mark next failure
        if: steps.continue_after_0005.outputs.rc != '' && steps.continue_after_0005.outputs.rc != '0'
        run: exit 1

      - name: Fail if event 0004 was not the expected conflict
        if: steps.continue_replay.outputs.rc != '10'
        run: |
          echo "Expected event 0004 replay conflict rc=10, got ${{ steps.continue_replay.outputs.rc }}"
          exit 1

      - name: Fail if event 0005 was not the expected conflict
        if: steps.continue_after_0004.outputs.rc != '10'
        run: |
          echo "Expected event 0005 replay conflict rc=10, got ${{ steps.continue_after_0004.outputs.rc }}"
          exit 1
# retrigger after generated-settings auto-adapter

# retrigger after generalized generated-settings resolver
