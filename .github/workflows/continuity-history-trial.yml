name: Continuity History Trial

on:
  push:
    paths:
      - ".github/workflows/continuity-history-trial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-until-first-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout continuity lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure disposable replay branch
        run: |
          git config user.name "continuity-trial"
          git config user.email "continuity-trial@invalid.local"
          git switch -c continuity-history-trial-local

      - name: Replay until first failure
        id: replay
        shell: bash
        run: |
          set +e
          python3 lab/tools/replay_upstream.py 2>&1 | tee /tmp/continuity-replay.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnostic snapshot
        if: always()
        run: |
          echo "---- replay exit ----"
          echo "${{ steps.replay.outputs.rc }}"
          echo "---- HEAD ----"
          git log -1 --format=fuller || true
          echo "---- working tree ----"
          git status --short || true
          echo "---- unmerged ----"
          git diff --name-only --diff-filter=U || true
          echo "---- index stages ----"
          git ls-files -u || true
          echo "---- combined diff: serve/server.py ----"
          git diff --cc -- serve/server.py || true
          echo "---- conflict markers with context ----"
          if grep -n '<<<<<<<' serve/server.py >/tmp/conflict-lines 2>/dev/null; then
            while IFS=: read -r n rest; do
              start=$((n > 35 ? n - 35 : 1))
              end=$((n + 80))
              echo "===== serve/server.py lines $start..$end ====="
              sed -n "${start},${end}p" serve/server.py
            done </tmp/conflict-lines
          fi
          echo "---- stage 1 (merge base) relevant READY block ----"
          git show :1:serve/server.py 2>/dev/null | grep -n -A18 -B12 'self.can_hold' | head -n 120 || true
          echo "---- stage 2 (continuity ours) relevant READY block ----"
          git show :2:serve/server.py 2>/dev/null | grep -n -A18 -B12 'self.can_hold' | head -n 120 || true
          echo "---- stage 3 (upstream theirs) relevant READY block ----"
          git show :3:serve/server.py 2>/dev/null | grep -n -A18 -B12 'self.can_hold' | head -n 120 || true
          echo "---- last 250 replay lines ----"
          tail -n 250 /tmp/continuity-replay.log || true

      - name: Mark detected failure
        if: steps.replay.outputs.rc != '0'
        run: |
          echo "Continuity replay stopped with rc=${{ steps.replay.outputs.rc }}"
          exit 1